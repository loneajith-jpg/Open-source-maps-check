<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map Link Converter</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1c2420;--mute:#62706a;--line:#dfe4de;--acc:#1f7a4d;--accink:#fff;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b231f;--ink:#e8eee9;--mute:#9aa8a0;--line:#2c3732;--acc:#4cc58a;--accink:#08130d;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b231f;--ink:#e8eee9;--mute:#9aa8a0;--line:#2c3732;--acc:#4cc58a;--accink:#08130d;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mute)}
textarea{width:100%;min-height:96px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.row{display:flex;gap:8px;margin:10px 0 18px;flex-wrap:wrap}
button,a.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
button.primary{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.msg{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:16px;color:var(--mute)}
.msg.err{color:var(--err);border-color:var(--err)}
.pin{font-weight:600;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h2{font-size:.95rem;margin:0 0 6px}
.url{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--mute);margin-bottom:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button,.acts a.btn{padding:6px 12px;font-size:.9rem}
small{color:var(--mute);display:block;margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Map Link Converter</h1>
<p class="sub">Paste a map link from WhatsApp (Google Maps, Organic Maps, OpenStreetMap, HERE WeGo, a geo: link) and get a link for every app.</p>
<textarea id="in" placeholder="Paste a link here, for example https://www.google.com/maps/@12.9716,77.5946,15z" aria-label="Map link"></textarea>
<div class="row">
<button class="primary" id="go">Convert</button>
<button id="paste">Paste from clipboard</button>
<button id="clear">Clear</button>
</div>
<div id="status" class="msg" hidden></div>
<div id="out"></div>
<small id="privacy"></small>
</main>
<script>
(function(){
/* ------------------------------------------------------------------
   SETTINGS
   Put the address of your Cloudflare Worker here (see worker.js), for
   example "https://map-resolver.yourname.workers.dev".
   Leave it empty to keep everything offline: short Google links will
   then ask you to open them in a browser first.
------------------------------------------------------------------- */
var RESOLVER_URL = "https://map-resolver.loneajith.workers.dev/";

var $=function(id){return document.getElementById(id)};
var SHORT=/(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs|share\.google)/i;
var RESOLVABLE=/https?:\/\/(?:maps\.app\.goo\.gl\/[^\s]+|goo\.gl\/maps\/[^\s]+)/i;
var B64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

function ok(a,b){a=+a;b=+b;return isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180}

/* Organic Maps / ge0 short links: omaps.app/<zoom char><coordinates>/<name>
   The first character is the zoom, the rest holds latitude and longitude as
   interleaved 3-bit groups (6 bits per character), so it decodes offline. */
function decodeGe0(code){
  if(code.length<3) return null;
  var zi=B64.indexOf(code.charAt(0)); if(zi<0) return null;
  var la=0, lo=0, n=code.length-1, i, a;
  for(i=1;i<code.length;i++){
    a=B64.indexOf(code.charAt(i)); if(a<0) return null;
    la=la*8+(((a>>5&1)<<2)|((a>>3&1)<<1)|(a>>1&1));
    lo=lo*8+(((a>>4&1)<<2)|((a>>2&1)<<1)|(a&1));
  }
  var max=Math.pow(2,3*n);
  var lat=(la+0.5)/max*180-90, lon=(lo+0.5)/max*360-180;
  if(!ok(lat,lon)) return null;
  return {lat:lat,lon:lon,z:Math.max(1,Math.min(19,Math.round(zi/4+4)))};
}
function cleanName(s){
  if(!s) return "";
  try{s=decodeURIComponent(s)}catch(e){}
  return s.replace(/[_+]/g," ").trim();
}


/* HERE WeGo links: wego.here.com/r/<mode>/s-<code>/s-<code> (route) and wego.here.com/p/s-<code> (place).
   Each s-<code> is base64 text like "lat=13.07745;lon=80.26085;n=Name;..." so it decodes offline. */
function hereDecode(seg){
  try{
    var b=seg.replace(/^s-/,"").replace(/-/g,"+").replace(/_/g,"/");
    while(b.length%4) b+="=";
    var txt=atob(b), o={};
    txt.split(";").forEach(function(kv){var i=kv.indexOf("="); if(i>0) o[kv.slice(0,i)]=kv.slice(i+1)});
    if(!ok(o.lat,o.lon)) return null;
    var nm=o.n||""; try{nm=decodeURIComponent(nm)}catch(e){}
    return {lat:+o.lat,lon:+o.lon,name:nm};
  }catch(e){return null}
}
function hereSegs(str){
  var out=[], re=/\/(s-[^\/?#\s]+)/g, m;
  while((m=re.exec(str))) out.push(m[1]);
  return out;
}
function parseHereRoute(t){
  var m=t.match(/wego\.here\.com\/r\/([A-Za-z]+)(\/[^?#\s]*)/i);
  if(!m) return null;
  var pts=hereSegs(m[2]).map(hereDecode);
  if(pts.length<2||pts.some(function(x){return !x})) return null;
  var md=m[1].toLowerCase(), mode=0;
  if(md==="walk") mode=2; else if(md==="bicycle"||md==="bike") mode=1; else if(/transit|public/.test(md)) mode=3;
  return {route:true,points:pts,mode:mode};
}
function parseHerePlace(t){
  var m=t.match(/wego\.here\.com\/p(\/[^?#\s]*)/i);
  if(!m) return null;
  var segs=hereSegs(m[1]); if(!segs.length) return null;
  var d=hereDecode(segs[0]); if(!d) return null;
  return {lat:d.lat,lon:d.lon,z:16,name:d.name,approx:false};
}

/* Google Maps directions links (/maps/dir/Start/End/...): collect every waypoint
   instead of only the first pin. Travel mode in the link: !3e0 car, 1 bike, 2 walk, 3 transit. */
var MODES=["driving","bicycling","walking","transit"];
function parseRoute(t){
  var hr=parseHereRoute(t); if(hr) return hr;
  var points=[], mode=0, m, k, ok2=true;
  var NUM="(-?\\d{1,3}(?:\\.\\d+)?)";
  var cre=new RegExp("^"+NUM+",\\s*"+NUM+"$");
  var pm=t.match(/\/maps\/dir\/([^?#\s]*)/i);
  if(pm&&pm[1]){
    var segs=pm[1].split("/").filter(function(x){return x&&x.charAt(0)!=="@"&&x.indexOf("data=")!==0});
    var pairs=[], re=new RegExp("!3d"+NUM+"!4d"+NUM,"g"), mm;
    while((mm=re.exec(t))) pairs.push([+mm[1],+mm[2]]);
    for(k=0;k<segs.length;k++){
      var d=segs[k].replace(/\+/g," "); try{d=decodeURIComponent(d)}catch(e){}
      var c=d.match(cre);
      if(c&&ok(c[1],c[2])) points.push({lat:+c[1],lon:+c[2],name:""});
      else if(pairs[k]&&ok(pairs[k][0],pairs[k][1])) points.push({lat:pairs[k][0],lon:pairs[k][1],name:d});
      else ok2=false;
    }
    m=t.match(/!3e([0-3])/); if(m) mode=+m[1];
  } else {
    var s2=t; try{s2=decodeURIComponent(t)}catch(e){}
    var o=s2.match(new RegExp("[?&]origin="+NUM+",\\s*"+NUM));
    var dd=s2.match(new RegExp("[?&]destination="+NUM+",\\s*"+NUM));
    if(!(o&&dd)||!/\/maps\/dir/i.test(s2)) return null;
    points=[{lat:+o[1],lon:+o[2],name:""},{lat:+dd[1],lon:+dd[2],name:""}];
    m=s2.match(/[?&]travelmode=(driving|bicycling|walking|transit)/); if(m) mode=MODES.indexOf(m[1]);
  }
  if(!ok2||points.length<2) return null;
  return {route:true,points:points,mode:mode};
}
function buildRoute(p){
  var a=p.points[0], b=p.points[p.points.length-1], mid=p.points.slice(1,-1);
  var A=fmt(a.lat)+","+fmt(a.lon), B=fmt(b.lat)+","+fmt(b.lon);
  var gm=MODES[p.mode], omType=["vehicle","bicycle","pedestrian","transit"][p.mode];
  var osmEngine=["fossgis_osrm_car","fossgis_osrm_bike","fossgis_osrm_foot","fossgis_osrm_car"][p.mode];
  var way=mid.length?"&waypoints="+mid.map(function(x){return fmt(x.lat)+","+fmt(x.lon)}).join("%7C"):"";
  return [
    {t:"Google Maps route (share this one on WhatsApp)",u:"https://www.google.com/maps/dir/?api=1&origin="+A+"&destination="+B+"&travelmode="+gm+way, open:true},
    {t:"Organic Maps route (opens the app)"+(mid.length?" – start and end only, "+mid.length+" stop(s) left out":""),
     u:"om://route?v=1&sll="+A+(a.name?"&saddr="+encodeURIComponent(a.name):"")+"&dll="+B+(b.name?"&daddr="+encodeURIComponent(b.name):"")+"&type="+omType, open:true},
    {t:"Open route directly in Organic Maps (Android only, keeps your default apps)"+(mid.length?" – start and end only":""),
     u:"intent://route?v=1&sll="+A+"&dll="+B+"&type="+omType+"#Intent;scheme=om;package=app.organicmaps;S.browser_fallback_url="+encodeURIComponent("https://organicmaps.app")+";end", open:true, noCopy:true},
    {t:"Open route directly in Vela Maps (Android only, start and end)",
     u:"intent://www.google.com/maps/dir/?api=1&origin="+A+"&destination="+B+"&travelmode="+gm+way+"#Intent;scheme=https;package=app.vela;S.browser_fallback_url="+encodeURIComponent("https://github.com/PimpinPumpkin/Vela/releases")+";end", open:true, noCopy:true},
    {t:"OpenStreetMap route"+(mid.length?" – start and end only":"")+(p.mode===3?" (driving; transit isn’t available)":""),
     u:"https://www.openstreetmap.org/directions?engine="+osmEngine+"&route="+A+"%3B"+B, open:true},
    p.mode===0?{t:"HERE WeGo route",u:"https://wego.here.com/r/drive/"+hereSeg(a)+"/"+hereSeg(b), open:true}:null,
    {t:"Start and end coordinates",u:"Start: "+A+"\nEnd: "+B, open:false}
  ].filter(Boolean);
}
function hereSeg(x){
  return "s-"+btoa("lat="+fmt(x.lat)+";lon="+fmt(x.lon)+";n="+encodeURIComponent(x.name||"Place")+";ph=");
}

function parse(raw){
  var t=raw.trim(); if(!t) return null;
  var rt=parseRoute(t); if(rt) return rt;
  var hp=parseHerePlace(t); if(hp) return hp;
  var s=t; try{s=decodeURIComponent(t)}catch(e){}
  var N="(-?\\d{1,3}(?:\\.\\d+)?)", m, lat, lon, z=16, name="", approx=false;

  /* Organic Maps links first (readable coordinates, then the encoded form) */
  m=s.match(new RegExp("(?:omaps\\.app|ge0\\.me)/"+N+",\\s*"+N+"(?:/([^?#\\s]*))?","i"));
  if(m&&ok(m[1],m[2])) return {lat:+m[1],lon:+m[2],z:16,name:cleanName(m[3]),approx:false};
  m=s.match(/(?:omaps\.app|ge0\.me|ge0:\/)\/\/?([A-Za-z0-9_-]{4,11})(?:\/([^?#\s]*))?/i);
  if(m){var g=decodeGe0(m[1]); if(g){g.name=cleanName(m[2]); g.approx=false; return g}}

  var pn=s.match(/\/place\/([^\/@?]+)/);
  if(pn){var n=pn[1].replace(/\+/g," "); if(!/^-?\d+(\.\d+)?,\s*-?\d+/.test(n)) name=n}
  var zm=s.match(/@[^,]+,[^,]+,(\d+(?:\.\d+)?)z/)||s.match(/#map=(\d+)/)||s.match(/[?&]z(?:oom)?=(\d+)/);
  if(zm) z=Math.round(+zm[1]);
  /* exact pin patterns first; the last two are only the map centre */
  var pats=[
    [new RegExp("!3d"+N+"!4d"+N),false],
    [new RegExp("mlat="+N+"&(?:amp;)?mlon="+N),false],
    [new RegExp("share\\.here\\.com/l/"+N+","+N),false],
    [new RegExp("[?&](?:q|query|ll|destination|daddr|center|saddr)="+N+",\\s*\\+?"+N),false],
    [new RegExp("geo:"+N+","+N,"i"),false],
    [new RegExp("/maps/place/"+N+","+N),false],
    [new RegExp("@"+N+","+N),true],
    [new RegExp("#map=\\d+/"+N+"/"+N),true]
  ];
  for(var i=0;i<pats.length;i++){
    m=s.match(pats[i][0]);
    if(m&&ok(m[1],m[2])){lat=+m[1];lon=+m[2];approx=pats[i][1];break}
  }
  if(lat===undefined){
    if(SHORT.test(s)) return {short:true,raw:t};
    if(/google\.[a-z.]+\/maps/i.test(s)&&name) return {nameOnly:name};
    return null;
  }
  return {lat:lat,lon:lon,z:z,name:name,approx:approx};
}

function fmt(x){return (+x).toFixed(6).replace(/0+$/,"").replace(/\.$/,"")}
/* "Open in this exact app" links for Chrome on Android. They name the app by its package, so the
   phone's chooser and default-app settings are never touched; if the app is missing, the fallback page opens. */
function intentGeo(p,pkg,fallback){
  return "intent:"+fmt(p.lat)+","+fmt(p.lon)+"?z="+p.z+"#Intent;scheme=geo;package="+pkg+";S.browser_fallback_url="+encodeURIComponent(fallback)+";end";
}
function build(p){
  var c=fmt(p.lat)+","+fmt(p.lon), nm=p.name?encodeURIComponent(p.name):"";
  return [
    {t:"Google Maps (share this one on WhatsApp)",u:"https://www.google.com/maps/search/?api=1&query="+c, open:true},
    {t:"Organic Maps (opens the app)",u:"om://map?v=1&ll="+c+(nm?"&n="+nm:"")+"&zoom="+p.z, open:true},
    {t:"geo: link (Organic Maps, CoMaps, OsmAnd, Vela Maps, most Android apps)",u:"geo:"+c+"?z="+p.z, open:true},
    {t:"Open directly in Vela Maps (Android only, keeps your default apps)",u:intentGeo(p,"app.vela","https://github.com/PimpinPumpkin/Vela/releases"), open:true, noCopy:true},
    {t:"Open directly in Vela Maps using the Google link (Android only, try this if the one above fails)",u:"intent://www.google.com/maps/search/?api=1&query="+c+"#Intent;scheme=https;package=app.vela;S.browser_fallback_url="+encodeURIComponent("https://github.com/PimpinPumpkin/Vela/releases")+";end", open:true, noCopy:true},
    {t:"Open directly in Organic Maps (Android only, keeps your default apps)",u:intentGeo(p,"app.organicmaps","https://organicmaps.app"), open:true, noCopy:true},
    {t:"Open directly in OsmAnd (Android only, keeps your default apps)",u:intentGeo(p,"net.osmand.plus","https://f-droid.org/packages/net.osmand.plus/"), open:true, noCopy:true},
    {t:"Organic Maps web link (omaps.app)",u:"https://omaps.app/"+c+(nm?"/"+nm:""), open:true},
    {t:"OpenStreetMap",u:"https://www.openstreetmap.org/?mlat="+fmt(p.lat)+"&mlon="+fmt(p.lon)+"#map="+p.z+"/"+fmt(p.lat)+"/"+fmt(p.lon), open:true},
    {t:"HERE WeGo",u:"https://share.here.com/l/"+c+"?z="+p.z, open:true},
    {t:"Plain coordinates",u:c, open:false}
  ];
}

function copy(text,btn){
  var done=function(){var o=btn.textContent;btn.textContent="Copied ✓";setTimeout(function(){btn.textContent=o},1400)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,function(){fb()})}else fb();
  function fb(){var a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(a)}
}
function say(txt,err){var e=$("status");e.hidden=!txt;e.textContent=txt||"";e.className="msg"+(err?" err":"")}

function show(p){
  var out=$("out"); out.textContent=""; say("");
  if(!p){say("I couldn’t find a location in that text. Try a Google Maps link that contains coordinates, an Organic Maps (omaps.app) link, an OpenStreetMap link, or a geo: link.",true);return}
  if(p.route){showRoute(p);return}
  if(p.short){
    say(RESOLVER_URL
      ? "I couldn’t resolve this short link. Open it once in your browser, then copy the full address from the address bar and paste that here."
      : "This is a short link, so the coordinates are hidden behind a redirect. Open it once in your browser, then copy the full address from the address bar and paste that here.",true);
    return;
  }
  if(p.nameOnly){
    say("This link only has a place name (“"+p.nameOnly+"”) and no coordinates. Search it on OpenStreetMap, open the result, and paste that link here.",true);
    var a=document.createElement("a");a.className="btn";a.target="_blank";a.rel="noopener";
    a.href="https://www.openstreetmap.org/search?query="+encodeURIComponent(p.nameOnly);a.textContent="Search on OpenStreetMap";
    out.appendChild(a);return;
  }
  var h=document.createElement("div");h.className="msg";
  var b=document.createElement("span");b.className="pin";b.textContent="Found: "+fmt(p.lat)+", "+fmt(p.lon);
  h.appendChild(b);if(p.name)h.appendChild(document.createTextNode(" · "+p.name));
  if(p.approx)h.appendChild(document.createTextNode(" · This link only has the map centre, so the pin may be slightly off the exact place."));
  out.appendChild(h);
  addCards(build(p));
}
function label(x){return x.name||(fmt(x.lat)+", "+fmt(x.lon))}
function showRoute(p){
  var out=$("out"), a=p.points[0], b=p.points[p.points.length-1];
  var h=document.createElement("div");h.className="msg";
  var t=document.createElement("span");t.className="pin";t.textContent="Route: "+label(a)+" → "+label(b);
  h.appendChild(t);
  // h.appendChild(document.createTextNode(" · "+["driving","cycling","walking","public transport"][p.mode]+(p.points.length>2?" · "+(p.points.length-2)+" stop(s) in between":"")));
  out.appendChild(h);
  addCards(buildRoute(p));
}
function addCards(list){
  var out=$("out");
  list.forEach(function(r){
    var c=document.createElement("div");c.className="card";
    var t=document.createElement("h2");t.textContent=r.t;
    var u=document.createElement("div");u.className="url";u.style.whiteSpace="pre-wrap";u.textContent=r.u;
    var ac=document.createElement("div");ac.className="acts";
    if(!r.noCopy){var cb=document.createElement("button");cb.className="primary";cb.textContent="Copy";
    cb.onclick=function(){copy(r.u,cb)};ac.appendChild(cb);}
    if(r.open){var o=document.createElement("a");o.className="btn"+(r.noCopy?" primary":"");o.href=r.u;o.textContent="Open";
      if(/^https/.test(r.u)){o.target="_blank";o.rel="noopener"}ac.appendChild(o)}
    c.appendChild(t);c.appendChild(u);c.appendChild(ac);out.appendChild(c);
  });
}

var token=0;
function render(){
  var my=++token;
  $("out").textContent=""; say("");
  var raw=$("in").value;
  if(!raw.trim()) return;
  var p=parse(raw);
  if(p&&p.short&&RESOLVER_URL){
    var m=raw.match(RESOLVABLE);
    if(m){
      say("Resolving short link…");
      fetch(RESOLVER_URL.replace(/\/$/,"")+"/?url="+encodeURIComponent(m[0]))
        .then(function(r){return r.json()})
        .then(function(d){
          if(my!==token) return;                 /* a newer paste replaced this one */
          if(!d||!d.url){show(p);return}
          var q=parse(d.url);
          show(q&&!q.short?q:p);
        })
        .catch(function(){ if(my===token) show(p) });
      return;
    }
  }
  show(p);
}

$("privacy").textContent = RESOLVER_URL
  ? "Everything is worked out in your browser, except Google short links (maps.app.goo.gl): those are sent to the resolver you set up so it can follow the redirect. Nothing else leaves this page."
  : "Runs entirely in your browser. Nothing is sent anywhere. Google short links (maps.app.goo.gl) can’t be read offline: open them once in your browser and paste the full address instead.";

var timer;
$("go").onclick=render;
$("in").addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(render,350)});
$("clear").onclick=function(){$("in").value="";render()};
$("paste").onclick=function(){
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(t){$("in").value=t;render()},function(){say("Clipboard access was blocked. Long-press in the box and paste instead.",true)});
  }else say("Your browser doesn’t allow clipboard reading. Long-press in the box and paste instead.",true);
};

if(typeof module!=="undefined") module.exports={parse:parse,parseHereRoute:parseHereRoute,build:build,decodeGe0:decodeGe0,buildRoute:buildRoute};
})();
</script>
</body>
</html>
